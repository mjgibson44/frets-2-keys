name: Frets2Keys
options:
  bundleIdPrefix: com.mjgibson44
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true
  developmentLanguage: en

packages:
  Frets2KeysCore:
    path: Frets2KeysCore

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Frets2Keys:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Frets2Keys
    dependencies:
      - package: Frets2KeysCore
    settings:
      base:
        PRODUCT_NAME: Frets 2 Keys
        PRODUCT_BUNDLE_IDENTIFIER: com.mjgibson44.frets2keys
        PRODUCT_MODULE_NAME: Frets2Keys
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Frets 2 Keys
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.music
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSHumanReadableCopyright: "Created by Matt Gibson in 2026"
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": Frets2Keys/Frets2Keys.entitlements
        "ENABLE_HARDENED_RUNTIME[sdk=macosx*]": YES
        "CODE_SIGN_IDENTITY[sdk=macosx*]": "-"
    scheme:
      testTargets: []
